name: Scrape Toffee Cookies

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libnss3 \
          libatk-bridge2.0-0 \
          libdrm-dev \
          libxkbcommon-dev \
          libgbm-dev \
          libasound2-dev \
          libxshmfence1 \
          libxcomposite1 \
          libxdamage1 \
          libxfixes3 \
          libxrandr2 \
          libxtst6 \
          libcups2 \
          libpango-1.0-0 \
          libcairo2 \
          libatspi2.0-0 \
          libx11-xcb1 \
          libxcb1 \
          libxcursor1 \
          libxi6 \
          libxss1 \
          libgtk-3-0 \
          libgbm1
    
    - name: Cache Playwright
      uses: actions/cache@v3
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          playwright-${{ runner.os }}-
    
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Playwright browsers
      run: |
        playwright install chromium
        playwright install-deps
    
    - name: Run cookie scraper
      run: python main.py
      continue-on-error: false
    
    - name: Upload cookies as artifact
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: toffee-cookies
        path: |
          toffee_cookies.json
          cookies.txt
          page_screenshot.png
        retention-days: 30
    
    - name: Commit and push if changed
      if: success()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add toffee_cookies.json cookies.txt
        git diff --staged --quiet || git commit -m "Update cookies [skip ci]"
        git push

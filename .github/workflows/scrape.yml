name: Scrape Toffee Cookies

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libnss3 libatk-bridge2.0-0 libdrm-dev libxkbcommon-dev \
          libgbm-dev libasound2-dev libxshmfence1 libxcomposite1 \
          libxdamage1 libxfixes3 libxrandr2 libxtst6 libcups2 \
          libpango-1.0-0 libcairo2 libatspi2.0-0 libx11-xcb1 \
          libxcb1 libxcursor1 libxi6 libxss1 libgtk-3-0 libgbm1
    
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Playwright browsers
      run: |
        playwright install chromium
        playwright install-deps
    
    - name: Run cookie scraper
      run: python main.py
    
    - name: Upload cookies as artifact
      uses: actions/upload-artifact@v4
      with:
        name: toffee-cookies
        path: |
          toffee_cookies.json
          cookies.txt
          page_screenshot.png
    
    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add toffee_cookies.json cookies.txt
        git diff --staged --quiet || git commit -m "Update cookies [skip ci]"
        git push
